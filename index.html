<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok Share</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wdth,wght@100,400;100,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone" data-node-id="67:6865">
      <header class="status-bar" data-node-id="67:6869" aria-hidden="true">
        <div class="status-bar__row">
          <div class="status-bar__time">
            <span>9:41</span>
          </div>
          <div class="status-bar__island">
            <div class="dynamic-island"></div>
            <div class="dynamic-island__camera"></div>
          </div>
          <div class="status-bar__island-spacer"></div>
          <div class="status-bar__levels">
            <div class="status-bar__icon status-bar__icon--cellular">
              <img src="assets/icon-cellular.svg" alt="" />
            </div>
            <div class="status-bar__icon status-bar__icon--wifi">
              <img src="assets/icon-wifi.svg" alt="" />
            </div>
            <div class="status-bar__icon status-bar__icon--battery">
              <img src="assets/icon-battery.svg" alt="" />
            </div>
          </div>
        </div>
      </header>

      <div class="video-card" data-node-id="67:6871">
        <img class="video-card__image" src="assets/video.png" alt="What I ate in Japan" />
        <div class="video-card__gradient" aria-hidden="true"></div>
      </div>

      <img
        class="progress"
        src="assets/progress.svg"
        alt=""
        data-node-id="67:6872"
      />

      <section class="sheet" data-node-id="67:6870" aria-label="Send to">
        <button class="search-btn" type="button" aria-label="Search" data-node-id="67:6877">
          <img src="assets/icon-search.svg" alt="" />
        </button>

        <h1 class="sheet__title" data-node-id="67:6879">Send to</h1>

        <button class="close-btn" type="button" aria-label="Close" data-node-id="67:6960">
          <img src="assets/icon-close.svg" alt="" />
        </button>

        <div class="contacts" data-node-id="67:7030">
          <div class="contacts__row">
            <button
              class="contact contact--duplicate"
              type="button"
              data-name="sammy"
              data-sent-ago="3 days ago"
              data-sent-short="3d ago"
              data-caption="we should go to the ramen"
            >
              <span class="contact__media">
                <img class="contact__avatar" src="assets/avatar-sammy.png" alt="" />
                <span class="contact__pulse"></span>
                <span class="contact__check"></span>
              </span>
              <span class="contact__name">sammy</span>
              <span class="share-tip" aria-hidden="true">Already sent · 3d ago</span>
            </button>
            <button class="contact" type="button" data-name="camryn, juliekgon, sammy">
              <span class="contact__media">
                <img class="contact__avatar" src="assets/avatar-group.png" alt="" />
                <span class="contact__check"></span>
              </span>
              <span class="contact__name contact__name--clamp">camryn, juliekgon, sammy</span>
            </button>
            <button
              class="contact contact--duplicate"
              type="button"
              data-name="juliekgon"
              data-sent-ago="5 hours ago"
              data-sent-short="5h ago"
              data-caption="wait this is the place"
            >
              <span class="contact__media">
                <img class="contact__avatar" src="assets/avatar-juliekgon.png" alt="" />
                <span class="contact__pulse"></span>
                <span class="contact__check"></span>
              </span>
              <span class="contact__name">juliekgon</span>
              <span class="share-tip" aria-hidden="true">Already sent · 5h ago</span>
            </button>
            <button class="contact" type="button" data-name="mega">
              <span class="contact__media">
                <img class="contact__avatar" src="assets/avatar-mega.png" alt="" />
                <span class="contact__check"></span>
              </span>
              <span class="contact__name">mega</span>
            </button>
          </div>
          <div class="contacts__row">
            <button class="contact" type="button" data-name="allison">
              <span class="contact__media">
                <img class="contact__avatar" src="assets/avatar-allison.png" alt="" />
                <span class="contact__check"></span>
              </span>
              <span class="contact__name">allison</span>
            </button>
            <button
              class="contact contact--duplicate"
              type="button"
              data-name="jolina"
              data-sent-ago="1 week ago"
              data-sent-short="1w ago"
              data-caption="adding this to the list"
            >
              <span class="contact__media">
                <img class="contact__avatar" src="assets/avatar-jolina.png" alt="" />
                <span class="contact__pulse"></span>
                <span class="contact__check"></span>
              </span>
              <span class="contact__name">jolina</span>
              <span class="share-tip" aria-hidden="true">Already sent · 1w ago</span>
            </button>
            <button class="contact" type="button" data-name="julianna">
              <span class="contact__media">
                <img class="contact__avatar" src="assets/avatar-julianna.png" alt="" />
                <span class="contact__check"></span>
              </span>
              <span class="contact__name">julianna</span>
            </button>
            <button class="contact" type="button" data-name="jake">
              <span class="contact__media">
                <img class="contact__avatar" src="assets/avatar-jake.png" alt="" />
                <span class="contact__check"></span>
              </span>
              <span class="contact__name">jake</span>
            </button>
          </div>
        </div>

        <div class="composer">
          <div class="composer__divider"></div>
          <button class="jump" type="button" tabindex="-1" aria-hidden="true">
            <span class="jump__accent"></span>
            <span class="jump__card">
              <span class="jump__cluster">
                <span class="jump__copy">
                  <span class="jump__label"></span>
                  <span class="jump__more"></span>
                </span>
                <span class="jump__thumb-wrap">
                  <img class="jump__thumb" src="assets/video.png" alt="" />
                </span>
              </span>
              <span class="jump__go" aria-hidden="true">
                <img src="assets/icon-jump.svg" alt="" width="20" height="20" />
              </span>
            </span>
          </button>
          <textarea
            class="composer__input"
            placeholder="Write a message..."
            aria-label="Write a message"
          ></textarea>
          <div class="composer__emoji">
            <button class="emoji" type="button">🥰</button>
            <button class="emoji" type="button">👍</button>
            <button class="emoji" type="button">😂</button>
            <button class="emoji" type="button">😎</button>
            <button class="emoji" type="button">🥺</button>
            <button class="emoji" type="button">🙏</button>
          </div>
          <button class="composer__send" type="button">Send</button>
        </div>

        <p class="sr-announcer" role="status" aria-live="polite"></p>
      </section>

      <div class="peek" aria-hidden="true" inert>
        <header class="peek__bar">
          <button class="peek__back" type="button" aria-label="Back to share">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M15 5L8 12L15 19"
                stroke="#161823"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <img class="peek__who" src="assets/avatar-sammy.png" alt="" />
          <div class="peek__meta">
            <p class="peek__title">sammy</p>
            <p class="peek__when">3 days ago</p>
          </div>
        </header>
        <div class="peek__thread">
          <article class="peek__msg">
            <img class="peek__avatar" src="assets/avatar-sammy.png" alt="" />
            <div class="peek__body">
              <p class="peek__name">sammy</p>
              <div class="peek__video">
                <img class="peek__cover" src="assets/video.png" alt="" />
                <span class="peek__play" aria-hidden="true"></span>
              </div>
              <p class="peek__caption">we should go to the ramen</p>
            </div>
          </article>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
